name: Fix Admin Password Hash (one-shot)
# One-shot workflow — delete after successful run.
# Updates the admin@owambe.com password hash in the staging DB to match
# the current seed value (Admin@Owambe2026!). Required because the seed
# upsert uses update:{} which does not refresh the hash on re-seed.
# Uses `railway run` which injects DATABASE_URL from the Railway service env.
on:
  workflow_dispatch:

jobs:
  fix-admin-password:
    name: Update admin password hash on staging DB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install API dependencies (for Prisma client)
        working-directory: apps/api
        run: npm install --legacy-peer-deps

      - name: Generate Prisma client
        working-directory: apps/api
        run: npx prisma generate
        env:
          DATABASE_URL: placeholder://placeholder

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Write fix script
        run: |
          cat > apps/api/fix-admin-password.mjs << 'EOF'
          import bcrypt from 'bcryptjs';
          import { PrismaClient } from '@prisma/client';

          const prisma = new PrismaClient();

          async function main() {
            const newHash = await bcrypt.hash('Admin@Owambe2026!', 12);

            // Try update first
            const result = await prisma.user.updateMany({
              where: { email: 'admin@owambe.com', role: 'ADMIN' },
              data: {
                passwordHash: newHash,
                isEmailVerified: true,
                isActive: true,
              },
            });

            if (result.count === 0) {
              console.log('WARN: No admin user found — creating...');
              await prisma.user.create({
                data: {
                  email: 'admin@owambe.com',
                  passwordHash: newHash,
                  firstName: 'Owambe',
                  lastName: 'Admin',
                  role: 'ADMIN',
                  isEmailVerified: true,
                  isActive: true,
                },
              });
              console.log('OK: Admin user created.');
            } else {
              console.log(`OK: Updated ${result.count} admin user(s) — password hash refreshed.`);
            }

            await prisma.$disconnect();
          }

          main().catch(e => { console.error('FAIL:', e.message); process.exit(1); });
          EOF

      - name: Run fix script via railway run (injects DATABASE_URL)
        working-directory: apps/api
        run: railway run --service owambe-api --environment staging node fix-admin-password.mjs
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}

      - name: Verify admin login via staging API
        run: |
          sleep 3
          RESPONSE=$(curl -s -X POST "https://owambe-api-staging.up.railway.app/api/auth/login" \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@owambe.com","password":"Admin@Owambe2026!"}')
          echo "Login response: $RESPONSE"
          echo "$RESPONSE" | grep -q '"success":true' \
            && echo "PASS: Admin login verified — admin@owambe.com / Admin@Owambe2026! is working." \
            || (echo "FAIL: Admin login still failing after hash update." && exit 1)
