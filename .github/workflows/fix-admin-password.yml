name: Fix Admin Password Hash (one-shot)
# One-shot workflow — delete after successful run.
# Updates the admin@owambe.com password hash in the staging DB.
# Uses railway run to inject DATABASE_URL, then runs a raw pg UPDATE.
on:
  workflow_dispatch:

jobs:
  fix-admin-password:
    name: Update admin password hash on staging DB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pg and bcryptjs
        run: npm install pg bcryptjs

      - name: Write fix script
        run: |
          cat > fix-admin-password.mjs << 'SCRIPT'
          import bcrypt from 'bcryptjs';
          import pg from 'pg';
          const { Client } = pg;

          const client = new Client({ connectionString: process.env.DATABASE_URL });
          await client.connect();

          const newHash = await bcrypt.hash('Admin@Owambe2026!', 12);

          const res = await client.query(
            `UPDATE "User"
             SET "passwordHash" = $1, "isEmailVerified" = true, "isActive" = true
             WHERE email = 'admin@owambe.com' AND role = 'ADMIN'
             RETURNING id, email, role`,
            [newHash]
          );

          if (res.rowCount === 0) {
            console.log('WARN: No admin row found — inserting...');
            await client.query(
              `INSERT INTO "User" (id, email, "passwordHash", "firstName", "lastName", role, "isEmailVerified", "isActive", "createdAt", "updatedAt")
               VALUES (gen_random_uuid(), 'admin@owambe.com', $1, 'Owambe', 'Admin', 'ADMIN', true, true, NOW(), NOW())`,
              [newHash]
            );
            console.log('OK: Admin user inserted.');
          } else {
            console.log('OK: Updated', res.rowCount, 'admin row(s). ID:', res.rows[0].id);
          }

          await client.end();
          SCRIPT

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Run fix script via railway run (injects DATABASE_URL)
        run: railway run --service owambe-api --environment staging node fix-admin-password.mjs
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}

      - name: Verify admin login via staging API
        run: |
          sleep 3
          RESPONSE=$(curl -s -X POST "https://owambe-api-staging.up.railway.app/api/auth/login" \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@owambe.com","password":"Admin@Owambe2026!"}')
          echo "Login response: $RESPONSE"
          echo "$RESPONSE" | grep -q '"success":true' \
            && echo "PASS: Admin login verified." \
            || (echo "FAIL: Admin login still failing." && exit 1)
