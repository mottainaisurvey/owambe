name: Railway Domain Fix (One-time)

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/railway-domain-fix.yml'
      - 'scripts/railway-domain-query.py'
  workflow_dispatch:

jobs:
  fix-domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Query all custom domains and status via Railway API
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: python3 scripts/railway-domain-query.py
