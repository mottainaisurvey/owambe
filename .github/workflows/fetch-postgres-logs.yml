name: Fetch Postgres Crash Logs

on:
  workflow_dispatch:

jobs:
  fetch-logs:
    runs-on: ubuntu-latest
    steps:
      - name: Install Railway CLI
        run: |
          curl -fsSL https://railway.app/install.sh | sh
          echo "/root/.railway/bin" >> $GITHUB_PATH

      - name: Fetch Postgres service logs
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
        run: |
          echo "=== Railway CLI version ==="
          railway --version
          echo "=== Postgres service logs (last 200 lines) ==="
          railway logs \
            --project c57d784c-0f16-4855-8adf-dfa37eaf3738 \
            --environment 388aaa3b-46e5-464f-be07-2b2501c6a4c9 \
            --service 5f9b25e9-9801-4e67-9262-cd010a5d012c \
            2>&1 | tail -200 || true
          echo "=== Done ==="
