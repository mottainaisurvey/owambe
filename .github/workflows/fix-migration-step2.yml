name: Fix Failed Migration Step2 Record
on:
  workflow_dispatch:
jobs:
  fix-migration:
    name: Mark pay_canonical_01_step2 as applied
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Install psql client
        run: sudo apt-get install -y postgresql-client

      - name: Write fix script
        run: |
          cat > /tmp/fix_migration.sh << 'SCRIPT'
          #!/bin/bash
          set -e
          echo "=== BEFORE ==="
          psql "$DATABASE_URL" -c "SELECT migration_name, finished_at, logs FROM _prisma_migrations WHERE migration_name = '20260511000001_pay_canonical_01_step2';"
          echo "=== APPLYING FIX ==="
          psql "$DATABASE_URL" -c "UPDATE _prisma_migrations SET finished_at = NOW(), applied_steps_count = 1, logs = NULL WHERE migration_name = '20260511000001_pay_canonical_01_step2' AND finished_at IS NULL;"
          echo "=== AFTER ==="
          psql "$DATABASE_URL" -c "SELECT migration_name, finished_at, applied_steps_count FROM _prisma_migrations WHERE migration_name = '20260511000001_pay_canonical_01_step2';"
          echo "=== DONE ==="
          SCRIPT
          chmod +x /tmp/fix_migration.sh

      - name: Run fix via railway run
        run: railway run --service owambe-api --environment staging -- bash /tmp/fix_migration.sh
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
