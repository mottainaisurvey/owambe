name: Owambe CI/CD

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

env:
  NODE_VERSION: '20'

jobs:
  # ─── LINT & TYPE CHECK ──────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - name: Type check API
        run: cd apps/api && npx tsc --noEmit
      - name: Type check Web
        run: cd apps/web && npx tsc --noEmit

  # ─── VOCABULARY LINT ─────────────────────────────────
  vocab-lint:
    name: Vocabulary Lint (Advisory)
    runs-on: ubuntu-latest
    continue-on-error: true  # Advisory mode — does not block CI
    steps:
      - uses: actions/checkout@v4
      - name: Run vocabulary linter
        run: |
          if [ -f scripts/vocab-lint.sh ]; then
            bash scripts/vocab-lint.sh || true
          else
            echo "⚠️  Vocabulary linter not yet configured (scripts/vocab-lint.sh missing)"
          fi

  # ─── TEST ────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: owambe
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: owambe_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Generate Prisma client
        run: cd apps/api && npx prisma generate
        env:
          DATABASE_URL: postgresql://owambe:testpass@localhost:5432/owambe_test
      - name: Run migrations
        run: cd apps/api && npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://owambe:testpass@localhost:5432/owambe_test
      - name: Run API tests
        run: cd apps/api && npm test
        env:
          DATABASE_URL: postgresql://owambe:testpass@localhost:5432/owambe_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret-minimum-32-characters-long
          NODE_ENV: test

  # ─── BUILD ───────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Build all packages
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}

  # ─── DEPLOY API TO STAGING (Railway) ─────────────────
  deploy-api-staging:
    name: Deploy API to Staging (Railway)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/staging'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy API to Railway staging
        run: railway up --service owambe-api --environment staging --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}

  # ─── DEPLOY WEB TO STAGING (Vercel Preview) ──────────
  deploy-web-staging:
    name: Deploy Web to Staging (Vercel Preview)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/staging'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Install Vercel CLI
        run: npm install -g vercel
      - name: Deploy to Vercel Preview
        run: vercel --token ${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ─── DEPLOY API TO PRODUCTION (Railway) ──────────────
  deploy-api-production:
    name: Deploy API to Production (Railway)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy API to Railway production
        run: railway up --service owambe-api --environment production --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # ─── DEPLOY WEB TO PRODUCTION (Vercel) ───────────────
  deploy-web-production:
    name: Deploy Web to Production (Vercel)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Install Vercel CLI
        run: npm install -g vercel
      - name: Deploy to Vercel Production
        run: vercel --prod --token ${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
