name: Railway API Redeploy
on:
  workflow_dispatch:
jobs:
  redeploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Redeploy API from apps/api directory
        run: |
          echo "=== Railway CLI version ==="
          railway --version
          echo "=== Deploying from apps/api ==="
          cd apps/api
          railway up --service owambe-api --environment production 2>&1
          echo "=== Deploy triggered ==="
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_API }}
