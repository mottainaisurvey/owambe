name: Set Railway Staging Variable (one-shot)
on:
  workflow_dispatch:
    inputs:
      variable_name:
        description: 'Variable name to set'
        required: true
        default: 'OWAMBE_WEBHOOK_OUTBOUND_SECRET'
      variable_value:
        description: 'Variable value to set'
        required: true
jobs:
  set-variable:
    name: Set Railway Variable
    runs-on: ubuntu-latest
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Set variable on Railway staging
        run: |
          railway variable set "${{ github.event.inputs.variable_name }}=${{ github.event.inputs.variable_value }}" \
            --service 3cc8cf6c-4fd0-4021-9473-5a4e569965be \
            --environment 388aaa3b-46e5-464f-be07-2b2501c6a4c9 \
            --project c57d784c-0f16-4855-8adf-dfa37eaf3738 \
            --json
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
      - name: Verify variable was set
        run: |
          railway variable list \
            --service 3cc8cf6c-4fd0-4021-9473-5a4e569965be \
            --environment 388aaa3b-46e5-464f-be07-2b2501c6a4c9 \
            --project c57d784c-0f16-4855-8adf-dfa37eaf3738 \
            --json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          var_name = '${{ github.event.inputs.variable_name }}'
          if var_name in data:
              print(f'SUCCESS: {var_name} is set (value length: {len(data[var_name])} chars)')
          else:
              print(f'ERROR: {var_name} not found in variables')
              print('Available keys:', list(data.keys()))
              sys.exit(1)
          "
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
      - name: Get logs from 75ec72ed deployment (active at PATCH time)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
        run: |
          echo "=== LOGS FROM 75ec72ed (deployment before 47af5bc wave4-seed) ==="
          railway logs 75ec72ed-45b5-4623-a3e3-3f48f94aa889 \
            --service 3cc8cf6c-4fd0-4021-9473-5a4e569965be \
            --environment 388aaa3b-46e5-464f-be07-2b2501c6a4c9 \
            -n 200 2>&1 || echo "75ec72ed logs failed"
          echo "=== LOGS FROM 62dbb6e4 (deployment at 02:12) ==="
          railway logs 62dbb6e4-367b-4d49-ac22-db93a48e4c3c \
            --service 3cc8cf6c-4fd0-4021-9473-5a4e569965be \
            --environment 388aaa3b-46e5-464f-be07-2b2501c6a4c9 \
            -n 200 2>&1 || echo "62dbb6e4 logs failed"
