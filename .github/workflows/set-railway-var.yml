name: Set Railway Staging Variable (one-shot)
on:
  workflow_dispatch:
    inputs:
      variable_name:
        description: 'Variable name to set'
        required: true
        default: 'OWAMBE_WEBHOOK_OUTBOUND_SECRET'
      variable_value:
        description: 'Variable value to set'
        required: true

jobs:
  set-variable:
    name: Set Railway Variable
    runs-on: ubuntu-latest
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Set variable on Railway staging
        run: |
          railway variable set "${{ github.event.inputs.variable_name }}=${{ github.event.inputs.variable_value }}" \
            --service 3cc8cf6c-4fd0-4021-9473-5a4e569965be \
            --environment 388aaa3b-46e5-464f-be07-2b2501c6a4c9 \
            --project c57d784c-0f16-4855-8adf-dfa37eaf3738 \
            --json
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}

      - name: Verify variable was set
        run: |
          railway variable list \
            --service 3cc8cf6c-4fd0-4021-9473-5a4e569965be \
            --environment 388aaa3b-46e5-464f-be07-2b2501c6a4c9 \
            --project c57d784c-0f16-4855-8adf-dfa37eaf3738 \
            --json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          var_name = '${{ github.event.inputs.variable_name }}'
          if var_name in data:
              print(f'SUCCESS: {var_name} is set (value length: {len(data[var_name])} chars)')
          else:
              print(f'ERROR: {var_name} not found in variables')
              print('Available keys:', list(data.keys()))
              sys.exit(1)
          "
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}

      - name: Query deployment logs for 47af5bc build
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
        run: |
          echo "=== DEPLOYMENT LIST ==="
          RESPONSE=$(curl -s -X POST https://backboard.railway.com/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"query":"query{deployments(input:{serviceId:\"3cc8cf6c-4fd0-4021-9473-5a4e569965be\",environmentId:\"388aaa3b-46e5-464f-be07-2b2501c6a4c9\"}){edges{node{id status createdAt meta{commitHash}}}}}"}') 
          echo "$RESPONSE" | python3 -c "
import sys,json
data=json.load(sys.stdin)
edges=data.get('data',{}).get('deployments',{}).get('edges',[])
for e in edges:
  n=e.get('node',{})
  m=n.get('meta',{})
  c=(m.get('commitHash') or '')
  print(n['id'],'|',n['status'],'|',n['createdAt'],'|',c[:8])
" 2>/dev/null
          DEPLOY_ID=$(echo "$RESPONSE" | python3 -c "
import sys,json
data=json.load(sys.stdin)
edges=data.get('data',{}).get('deployments',{}).get('edges',[])
for e in edges:
  n=e.get('node',{})
  m=n.get('meta',{})
  c=(m.get('commitHash') or '')
  if c.startswith('47af5bc'):
    print(n['id'])
    break
" 2>/dev/null)
          echo "Deploy ID for 47af5bc: $DEPLOY_ID"
          if [ -n "$DEPLOY_ID" ]; then
            echo "=== DEPLOYMENT LOGS FOR 47af5bc ==="
            LOGS=$(curl -s -X POST https://backboard.railway.com/graphql/v2 \
              -H "Authorization: Bearer $RAILWAY_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"query\":\"query{deploymentLogs(deploymentId:\\\"$DEPLOY_ID\\\"){timestamp message}}\"}")
            echo "$LOGS" | python3 -c "
import sys,json
data=json.load(sys.stdin)
logs=data.get('data',{}).get('deploymentLogs',[]) or []
for l in logs:
  print(l.get('timestamp',''),'|',l.get('message',''))
" 2>/dev/null | head -300
          else
            echo "47af5bc not found"
          fi
