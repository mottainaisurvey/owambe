name: Get Deployment Logs (OWB-WAVE-4-01)
on:
  workflow_dispatch:
jobs:
  get-logs:
    runs-on: ubuntu-latest
    steps:
      - name: Query Railway GraphQL for deployment ID of build 47af5bc
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
        run: |
          # Query deployments for the staging service to find the 47af5bc build
          RESPONSE=$(curl -s -X POST https://backboard.railway.com/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "query": "query { deployments(input: { serviceId: \"3cc8cf6c-4fd0-4021-9473-5a4e569965be\", environmentId: \"388aaa3b-46e5-464f-be07-2b2501c6a4c9\" }) { edges { node { id status createdAt meta { commitHash } } } } }"
            }')
          echo "=== DEPLOYMENTS ==="
          echo "$RESPONSE" | python3 -m json.tool 2>/dev/null || echo "$RESPONSE"
          
          # Extract deployment ID for build 47af5bc
          DEPLOY_ID=$(echo "$RESPONSE" | python3 -c "
import sys, json
data = json.load(sys.stdin)
edges = data.get('data', {}).get('deployments', {}).get('edges', [])
for edge in edges:
    node = edge.get('node', {})
    meta = node.get('meta', {})
    commit = meta.get('commitHash', '')
    print(f'ID: {node[\"id\"]} | Status: {node[\"status\"]} | Created: {node[\"createdAt\"]} | Commit: {commit[:8] if commit else \"N/A\"}')
" 2>/dev/null || echo "Parse failed")
          echo "=== DEPLOYMENT LIST ==="
          echo "$DEPLOY_ID"

      - name: Get logs for the 47af5bc deployment
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
        run: |
          # Get all deployment IDs and find the one for commit 47af5bc
          RESPONSE=$(curl -s -X POST https://backboard.railway.com/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "query": "query { deployments(input: { serviceId: \"3cc8cf6c-4fd0-4021-9473-5a4e569965be\", environmentId: \"388aaa3b-46e5-464f-be07-2b2501c6a4c9\" }) { edges { node { id status createdAt meta { commitHash } } } } }"
            }')
          
          # Find deployment ID for commit starting with 47af5bc
          DEPLOY_ID=$(echo "$RESPONSE" | python3 -c "
import sys, json
data = json.load(sys.stdin)
edges = data.get('data', {}).get('deployments', {}).get('edges', [])
for edge in edges:
    node = edge.get('node', {})
    meta = node.get('meta', {})
    commit = meta.get('commitHash', '') or ''
    if commit.startswith('47af5bc') or commit.startswith('47af5bcf'):
        print(node['id'])
        break
" 2>/dev/null)
          
          echo "Deployment ID for 47af5bc: $DEPLOY_ID"
          
          if [ -n "$DEPLOY_ID" ]; then
            echo "=== DEPLOYMENT LOGS FOR $DEPLOY_ID ==="
            curl -s -X POST https://backboard.railway.com/graphql/v2 \
              -H "Authorization: Bearer $RAILWAY_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"query\": \"query { deploymentLogs(deploymentId: \\\"$DEPLOY_ID\\\") { timestamp message } }\"}" \
              | python3 -m json.tool 2>/dev/null | head -200
          else
            echo "Deployment ID not found for commit 47af5bc"
          fi
