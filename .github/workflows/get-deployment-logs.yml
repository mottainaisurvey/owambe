name: Get Deployment Logs Wave4

on:
  workflow_dispatch:

jobs:
  get-logs:
    runs-on: ubuntu-latest
    steps:
      - name: Query Railway GraphQL deployments
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
        run: |
          RESPONSE=$(curl -s -X POST https://backboard.railway.com/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"query":"query{deployments(input:{serviceId:\"3cc8cf6c-4fd0-4021-9473-5a4e569965be\",environmentId:\"388aaa3b-46e5-464f-be07-2b2501c6a4c9\"}){edges{node{id status createdAt meta{commitHash}}}}}"}')
          echo "$RESPONSE"
          DEPLOY_ID=$(echo "$RESPONSE" | python3 -c "
import sys,json
data=json.load(sys.stdin)
edges=data.get('data',{}).get('deployments',{}).get('edges',[])
for e in edges:
  n=e.get('node',{})
  m=n.get('meta',{})
  c=(m.get('commitHash') or '')
  print(f'{n[\"id\"]} {n[\"status\"]} {n[\"createdAt\"]} {c[:8]}')
" 2>/dev/null)
          echo "=== DEPLOYMENT LIST ==="
          echo "$DEPLOY_ID"

      - name: Get logs for 47af5bc deployment
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
        run: |
          RESPONSE=$(curl -s -X POST https://backboard.railway.com/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"query":"query{deployments(input:{serviceId:\"3cc8cf6c-4fd0-4021-9473-5a4e569965be\",environmentId:\"388aaa3b-46e5-464f-be07-2b2501c6a4c9\"}){edges{node{id status createdAt meta{commitHash}}}}}"}')
          DEPLOY_ID=$(echo "$RESPONSE" | python3 -c "
import sys,json
data=json.load(sys.stdin)
edges=data.get('data',{}).get('deployments',{}).get('edges',[])
for e in edges:
  n=e.get('node',{})
  m=n.get('meta',{})
  c=(m.get('commitHash') or '')
  if c.startswith('47af5bc'):
    print(n['id'])
    break
" 2>/dev/null)
          echo "Deploy ID for 47af5bc: $DEPLOY_ID"
          if [ -n "$DEPLOY_ID" ]; then
            curl -s -X POST https://backboard.railway.com/graphql/v2 \
              -H "Authorization: Bearer $RAILWAY_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"query\":\"query{deploymentLogs(deploymentId:\\\"$DEPLOY_ID\\\"){timestamp message}}\"}" \
              | python3 -m json.tool 2>/dev/null | head -300
          fi
