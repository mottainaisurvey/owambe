name: Fetch Railway Staging Logs (OWB-WAVE-4-01)

on:
  workflow_dispatch:

jobs:
  fetch-logs:
    runs-on: ubuntu-latest
    steps:
      - name: Install Railway CLI
        run: curl -fsSL https://railway.app/install.sh | sh && echo "$HOME/.railway/bin" >> $GITHUB_PATH

      - name: Fetch recent Railway logs
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
        run: |
          # Fetch the last 200 lines of logs from the staging API service
          railway logs \
            --project c57d784c-0f16-4855-8adf-dfa37eaf3738 \
            --service 3cc8cf6c-4fd0-4021-9473-5a4e569965be \
            --environment 388aaa3b-46e5-464f-be07-2b2501c6a4c9 \
            -n 200 2>&1 || true

      - name: Filter dispatcher-relevant log lines
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
        run: |
          echo "=== DISPATCHER + WEBHOOK LOG LINES ==="
          railway logs \
            --project c57d784c-0f16-4855-8adf-dfa37eaf3738 \
            --service 3cc8cf6c-4fd0-4021-9473-5a4e569965be \
            --environment 388aaa3b-46e5-464f-be07-2b2501c6a4c9 \
            -n 300 2>&1 | grep -i "webhook\|dispatch\|WAVE4\|CHECKED_IN\|outbound\|CC-WAVE4\|coastal\|setImmediate\|owb-evt\|x-owambe\|signature\|inbound\|200\|error\|warn" || echo "No matching lines found"
