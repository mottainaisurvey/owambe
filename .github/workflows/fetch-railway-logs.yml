name: Fetch Railway Staging Logs (OWB-WAVE-4-01)
on:
  workflow_dispatch:
jobs:
  fetch-logs:
    runs-on: ubuntu-latest
    steps:
      - name: Install Railway CLI
        run: curl -fsSL https://railway.app/install.sh | bash

      - name: Add Railway to PATH
        run: echo "$HOME/.railway/bin" >> $GITHUB_PATH

      - name: Get deployment list via GraphQL
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
        run: |
          echo "=== DEPLOYMENT LIST ==="
          RESPONSE=$(curl -s -X POST https://backboard.railway.com/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"query":"query{deployments(input:{serviceId:\"3cc8cf6c-4fd0-4021-9473-5a4e569965be\",environmentId:\"388aaa3b-46e5-464f-be07-2b2501c6a4c9\"}){edges{node{id status createdAt meta{commitHash}}}}}"}')
          echo "$RESPONSE" | python3 -c "
import sys,json
data=json.load(sys.stdin)
edges=data.get('data',{}).get('deployments',{}).get('edges',[])
for e in edges:
  n=e.get('node',{})
  m=n.get('meta',{})
  c=(m.get('commitHash') or '')
  print(n['id'],'|',n['status'],'|',n['createdAt'],'|',c[:8])
" 2>/dev/null
          echo "RAW: $RESPONSE" | head -c 500

      - name: Get logs for 47af5bc deployment via GraphQL
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
        run: |
          RESPONSE=$(curl -s -X POST https://backboard.railway.com/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"query":"query{deployments(input:{serviceId:\"3cc8cf6c-4fd0-4021-9473-5a4e569965be\",environmentId:\"388aaa3b-46e5-464f-be07-2b2501c6a4c9\"}){edges{node{id status createdAt meta{commitHash}}}}}"}')
          DEPLOY_ID=$(echo "$RESPONSE" | python3 -c "
import sys,json
data=json.load(sys.stdin)
edges=data.get('data',{}).get('deployments',{}).get('edges',[])
for e in edges:
  n=e.get('node',{})
  m=n.get('meta',{})
  c=(m.get('commitHash') or '')
  if c.startswith('47af5bc'):
    print(n['id'])
    break
" 2>/dev/null)
          echo "Deploy ID for 47af5bc: $DEPLOY_ID"
          if [ -n "$DEPLOY_ID" ]; then
            echo "=== DEPLOYMENT LOGS FOR 47af5bc ==="
            LOGS=$(curl -s -X POST https://backboard.railway.com/graphql/v2 \
              -H "Authorization: Bearer $RAILWAY_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"query\":\"query{deploymentLogs(deploymentId:\\\"$DEPLOY_ID\\\"){timestamp message}}\"}")
            echo "$LOGS" | python3 -c "
import sys,json
data=json.load(sys.stdin)
logs=data.get('data',{}).get('deploymentLogs',[]) or []
for l in logs:
  print(l.get('timestamp',''),'|',l.get('message',''))
" 2>/dev/null | head -300
          else
            echo "47af5bc deployment not found. All commits:"
            echo "$RESPONSE" | python3 -c "
import sys,json
data=json.load(sys.stdin)
edges=data.get('data',{}).get('deployments',{}).get('edges',[])
for e in edges:
  n=e.get('node',{})
  m=n.get('meta',{})
  c=(m.get('commitHash') or '')
  print(c[:8],'|',n['id'],'|',n['createdAt'])
" 2>/dev/null
          fi

      - name: Fetch Railway logs via CLI (broader window)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
        run: |
          echo "=== RAILWAY CLI LOGS 02:05-02:15 UTC ==="
          railway logs \
            --project c57d784c-0f16-4855-8adf-dfa37eaf3738 \
            --service 3cc8cf6c-4fd0-4021-9473-5a4e569965be \
            --environment 388aaa3b-46e5-464f-be07-2b2501c6a4c9 \
            --since 2026-05-19T02:05:00Z \
            --until 2026-05-19T02:15:00Z 2>&1 || true
