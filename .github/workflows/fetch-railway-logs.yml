name: Fetch Railway Staging Logs (OWB-WAVE-4-01)

on:
  workflow_dispatch:

jobs:
  fetch-logs:
    runs-on: ubuntu-latest
    steps:
      - name: Install Railway CLI
        run: curl -fsSL https://railway.app/install.sh | bash

      - name: Add Railway to PATH
        run: echo "$HOME/.railway/bin" >> $GITHUB_PATH

      - name: Fetch logs from PATCH window (02:09-02:12 UTC)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
        run: |
          echo "=== ALL LOGS 02:09-02:12 UTC (PATCH WINDOW) ==="
          railway logs \
            --project c57d784c-0f16-4855-8adf-dfa37eaf3738 \
            --service 3cc8cf6c-4fd0-4021-9473-5a4e569965be \
            --environment 388aaa3b-46e5-464f-be07-2b2501c6a4c9 \
            --since 2026-05-19T02:09:00Z \
            --until 2026-05-19T02:12:30Z \
            --json 2>&1 || true

      - name: Fetch logs from broader window (02:05-02:15 UTC)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
        run: |
          echo "=== ALL LOGS 02:05-02:15 UTC (BROADER WINDOW) ==="
          railway logs \
            --project c57d784c-0f16-4855-8adf-dfa37eaf3738 \
            --service 3cc8cf6c-4fd0-4021-9473-5a4e569965be \
            --environment 388aaa3b-46e5-464f-be07-2b2501c6a4c9 \
            --since 2026-05-19T02:05:00Z \
            --until 2026-05-19T02:15:00Z 2>&1 || true

      - name: Fetch HTTP logs from PATCH window
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
        run: |
          echo "=== HTTP LOGS 02:09-02:12 UTC ==="
          railway logs \
            --project c57d784c-0f16-4855-8adf-dfa37eaf3738 \
            --service 3cc8cf6c-4fd0-4021-9473-5a4e569965be \
            --environment 388aaa3b-46e5-464f-be07-2b2501c6a4c9 \
            --http \
            --since 2026-05-19T02:09:00Z \
            --until 2026-05-19T02:12:30Z 2>&1 || true
