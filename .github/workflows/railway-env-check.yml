name: Railway Env Check
on:
  workflow_dispatch:
jobs:
  check-env:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Check web service env vars (NEXT_PUBLIC_APP_URL)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "=== WEB SERVICE ENV VARS ==="
          railway variables --service owambe-web 2>&1 | grep -E "NEXT_PUBLIC_APP_URL|NEXT_PUBLIC_API_URL|NODE_ENV|APP_URL" || true
          echo "--- Full list (redacted) ---"
          railway variables --service owambe-web 2>&1 | grep -v "SECRET\|PASSWORD\|KEY\|TOKEN\|DATABASE\|REDIS" | head -40
      - name: Check API service env vars (NEXT_PUBLIC_APP_URL)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_API }}
        run: |
          echo "=== API SERVICE ENV VARS ==="
          railway variables --service owambe-api 2>&1 | grep -E "NEXT_PUBLIC_APP_URL|NEXT_PUBLIC_API_URL|NODE_ENV|APP_URL|FRONTEND_URL" || true
          echo "--- Full list (redacted) ---"
          railway variables --service owambe-api 2>&1 | grep -v "SECRET\|PASSWORD\|KEY\|TOKEN\|DATABASE\|REDIS" | head -40
