name: Read Railway Staging Variables (one-shot)
on:
  workflow_dispatch:

jobs:
  read-variables:
    name: Read Railway Variables
    runs-on: ubuntu-latest
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: List variables on Railway staging
        run: |
          railway variable list \
            --service 3cc8cf6c-4fd0-4021-9473-5a4e569965be \
            --environment 388aaa3b-46e5-464f-be07-2b2501c6a4c9 \
            --project c57d784c-0f16-4855-8adf-dfa37eaf3738 \
            --json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          print('Variable count:', len(data))
          print('Keys:', sorted(data.keys()))
          for key in ['COASTAL_CORRIDOR_SHARED_SECRET', 'COASTAL_CORRIDOR_WEBHOOK_SECRET', 'OWAMBE_WEBHOOK_OUTBOUND_SECRET', 'OWAMBE_API_KEY', 'DATABASE_URL', 'DATABASE_PUBLIC_URL', 'PGHOST', 'PGPORT', 'PGUSER', 'PGPASSWORD', 'PGDATABASE']:
              if key in data:
                  val = data[key]
                  print(f'{key}={val}')
              else:
                  print(f'{key}=NOT_SET')
          "
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}

      - name: Get deployment list and logs for 47af5bc build
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
        run: |
          echo "=== DEPLOYMENT LIST ==="
          RESPONSE=$(curl -s -X POST https://backboard.railway.com/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"query":"query{deployments(input:{serviceId:\"3cc8cf6c-4fd0-4021-9473-5a4e569965be\",environmentId:\"388aaa3b-46e5-464f-be07-2b2501c6a4c9\"}){edges{node{id status createdAt meta{commitHash}}}}}"}')
          echo "$RESPONSE" | python3 -c "
import sys,json
data=json.load(sys.stdin)
edges=data.get('data',{}).get('deployments',{}).get('edges',[])
for e in edges:
  n=e.get('node',{})
  m=n.get('meta',{})
  c=(m.get('commitHash') or '')
  print(n['id'],'|',n['status'],'|',n['createdAt'],'|',c[:8])
" 2>/dev/null

          echo "=== FINDING 47af5bc DEPLOYMENT ==="
          DEPLOY_ID=$(echo "$RESPONSE" | python3 -c "
import sys,json
data=json.load(sys.stdin)
edges=data.get('data',{}).get('deployments',{}).get('edges',[])
for e in edges:
  n=e.get('node',{})
  m=n.get('meta',{})
  c=(m.get('commitHash') or '')
  if c.startswith('47af5bc'):
    print(n['id'])
    break
" 2>/dev/null)
          echo "Deployment ID for 47af5bc: $DEPLOY_ID"

          if [ -n "$DEPLOY_ID" ]; then
            echo "=== DEPLOYMENT LOGS FOR 47af5bc ==="
            LOGS=$(curl -s -X POST https://backboard.railway.com/graphql/v2 \
              -H "Authorization: Bearer $RAILWAY_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"query\":\"query{deploymentLogs(deploymentId:\\\"$DEPLOY_ID\\\"){timestamp message}}\"}")
            echo "$LOGS" | python3 -c "
import sys,json
data=json.load(sys.stdin)
logs=data.get('data',{}).get('deploymentLogs',[]) or []
for l in logs:
  print(l.get('timestamp',''),'|',l.get('message',''))
" 2>/dev/null | head -300
          else
            echo "Deployment 47af5bc not found — listing all commits:"
            echo "$RESPONSE" | python3 -c "
import sys,json
data=json.load(sys.stdin)
edges=data.get('data',{}).get('deployments',{}).get('edges',[])
for e in edges:
  n=e.get('node',{})
  m=n.get('meta',{})
  c=(m.get('commitHash') or '')
  print(c[:8],'|',n['id'],'|',n['createdAt'])
" 2>/dev/null
          fi
